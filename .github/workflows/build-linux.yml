name: Build Linux

on:
  workflow_dispatch:
    inputs:
      arch:
        description: "Architecture"
        required: true
        type: choice
        options:
          - x64
          - arm64
          - both
        default: x64
      branch:
        description: "Branch to build (defaults to the branch you run from)"
        required: false
        type: string

jobs:
  build-x64:
    if: ${{ inputs.arch == 'x64' || inputs.arch == 'both' }}
    name: Linux x64
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      VSCODE_ARCH: x64
      NPM_ARCH: x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # Native-module build + .deb/.rpm packaging prerequisites. Linux does not
      # code-sign, so there is no signtool/codesign step (unlike win32/darwin).
      - name: Install Linux build dependencies
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config python3-setuptools \
            libx11-dev libxkbfile-dev libsecret-1-dev libkrb5-dev fakeroot rpm

      - name: Restore node_modules cache
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: .build/node_modules_cache
          key: node_modules-linux-x64-${{ hashFiles('package-lock.json') }}

      - name: Extract node_modules cache
        if: steps.cache-node-modules.outputs.cache-hit == 'true'
        run: tar -xzf .build/node_modules_cache/cache.tgz

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: |
          set -e
          for i in {1..3}; do
            npm ci && break
            if [ $i -eq 3 ]; then echo "npm ci failed" >&2; exit 1; fi
            echo "Retry $i..."
          done
        env:
          npm_config_arch: x64
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GYP_DEFINES: "kerberos_use_rtld=false"

      - name: Create node_modules cache
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: |
          set -e
          mkdir -p .build
          node build/azure-pipelines/common/listNodeModules.ts .build/node_modules_list.txt
          mkdir -p .build/node_modules_cache
          tar -czf .build/node_modules_cache/cache.tgz --files-from .build/node_modules_list.txt

      - name: Download built-in extensions
        run: node build/lib/builtInExtensions.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build client (minified)
        run: npm run gulp vscode-linux-x64-min
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package .tar.gz
        run: |
          set -e
          mkdir -p .build
          tar -czf "$GITHUB_WORKSPACE/.build/NexgileCode-linux-x64.tar.gz" -C .. VSCode-linux-x64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexgileCode-linux-x64
          path: .build/NexgileCode-linux-x64.tar.gz
          retention-days: 30

      - name: Build .deb and .rpm installers
        run: |
          set -e
          npm run gulp vscode-linux-x64-build-deb
          npm run gulp vscode-linux-x64-build-rpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: NexgileCodeSetup-linux-x64
          path: |
            .build/linux/deb/**/*.deb
            .build/linux/rpm/**/*.rpm
          retention-days: 30

  build-arm64:
    if: ${{ inputs.arch == 'arm64' || inputs.arch == 'both' }}
    name: Linux arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env:
      VSCODE_ARCH: arm64
      NPM_ARCH: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install Linux build dependencies
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config python3-setuptools \
            libx11-dev libxkbfile-dev libsecret-1-dev libkrb5-dev fakeroot rpm

      - name: Restore node_modules cache
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: .build/node_modules_cache
          key: node_modules-linux-arm64-${{ hashFiles('package-lock.json') }}

      - name: Extract node_modules cache
        if: steps.cache-node-modules.outputs.cache-hit == 'true'
        run: tar -xzf .build/node_modules_cache/cache.tgz

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: |
          set -e
          for i in {1..3}; do
            npm ci && break
            if [ $i -eq 3 ]; then echo "npm ci failed" >&2; exit 1; fi
            echo "Retry $i..."
          done
        env:
          npm_config_arch: arm64
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GYP_DEFINES: "kerberos_use_rtld=false"

      - name: Create node_modules cache
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: |
          set -e
          mkdir -p .build
          node build/azure-pipelines/common/listNodeModules.ts .build/node_modules_list.txt
          mkdir -p .build/node_modules_cache
          tar -czf .build/node_modules_cache/cache.tgz --files-from .build/node_modules_list.txt

      - name: Download built-in extensions
        run: node build/lib/builtInExtensions.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build client (minified)
        run: npm run gulp vscode-linux-arm64-min
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package .tar.gz
        run: |
          set -e
          mkdir -p .build
          tar -czf "$GITHUB_WORKSPACE/.build/NexgileCode-linux-arm64.tar.gz" -C .. VSCode-linux-arm64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexgileCode-linux-arm64
          path: .build/NexgileCode-linux-arm64.tar.gz
          retention-days: 30

      - name: Build .deb and .rpm installers
        run: |
          set -e
          npm run gulp vscode-linux-arm64-build-deb
          npm run gulp vscode-linux-arm64-build-rpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: NexgileCodeSetup-linux-arm64
          path: |
            .build/linux/deb/**/*.deb
            .build/linux/rpm/**/*.rpm
          retention-days: 30
