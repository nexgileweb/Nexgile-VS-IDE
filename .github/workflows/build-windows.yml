name: Build Windows

on:
  workflow_dispatch:
    inputs:
      arch:
        description: "Architecture"
        required: true
        type: choice
        options:
          - x64
          - arm64
          - both
        default: x64
      edition:
        description: "Bundled coding-agent edition (taa = no Chinese providers/models)"
        required: true
        type: choice
        options:
          - standard
          - taa
          - both
        default: both
      branch:
        description: "Branch to build (defaults to the branch you run from)"
        required: false
        type: string

jobs:
  build-x64:
    if: ${{ inputs.arch == 'x64' || inputs.arch == 'both' }}
    strategy:
      matrix:
        edition: ${{ fromJSON(inputs.edition == 'both' && '["standard","taa"]' || format('["{0}"]', inputs.edition || 'standard')) }}
    name: Windows x64 (${{ matrix.edition }})
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      VSCODE_ARCH: x64
      EDITION_SUFFIX: ${{ matrix.edition == 'taa' && '-taa' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Restore node_modules cache
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: .build/node_modules_cache
          key: node_modules-windows-x64-${{ hashFiles('package-lock.json') }}

      - name: Extract node_modules cache
        if: steps.cache-node-modules.outputs.cache-hit == 'true'
        shell: bash
        run: tar -xzf .build/node_modules_cache/cache.tgz

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -e
          for i in {1..3}; do
            npm ci && break
            if [ $i -eq 3 ]; then echo "npm ci failed" >&2; exit 1; fi
            echo "Retry $i..."
          done
        env:
          npm_config_arch: x64
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create node_modules cache
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -e
          mkdir -p .build
          node build/azure-pipelines/common/listNodeModules.ts .build/node_modules_list.txt
          mkdir -p .build/node_modules_cache
          tar -czf .build/node_modules_cache/cache.tgz --files-from .build/node_modules_list.txt

      - name: Select coding-agent edition
        shell: bash
        run: node scripts/select-nexgile-edition.mjs ${{ matrix.edition }}

      - name: Download built-in extensions
        shell: bash
        run: node build/lib/builtInExtensions.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Add Windows SDK (signtool) to PATH
        shell: pwsh
        run: |
          $sdk = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue | Sort-Object FullName | Select-Object -Last 1
          if ($sdk) {
            $dir = Split-Path $sdk.FullName
            "$dir" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
            Write-Host "Added signtool to PATH: $dir"
          } else {
            Write-Warning "signtool.exe not found under Windows Kits 10 bin"
          }

      - name: Build client (minified)
        shell: bash
        run: npm run gulp vscode-win32-x64-min
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package .zip
        shell: bash
        run: |
          set -e
          cd ../VSCode-win32-x64
          7z a "$GITHUB_WORKSPACE/.build/NexgileCode-win32-x64$EDITION_SUFFIX.zip" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexgileCode-win32-x64${{ env.EDITION_SUFFIX }}
          path: .build/NexgileCode-win32-x64${{ env.EDITION_SUFFIX }}.zip
          retention-days: 30

      - name: Build setup installer
        shell: bash
        run: npm run gulp vscode-win32-x64-user-setup
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: NexgileCodeSetup-win32-x64${{ env.EDITION_SUFFIX }}
          path: .build/win32-x64/user-setup/*.exe
          retention-days: 30

  build-arm64:
    if: ${{ inputs.arch == 'arm64' || inputs.arch == 'both' }}
    strategy:
      matrix:
        edition: ${{ fromJSON(inputs.edition == 'both' && '["standard","taa"]' || format('["{0}"]', inputs.edition || 'standard')) }}
    name: Windows arm64 (${{ matrix.edition }})
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      VSCODE_ARCH: arm64
      EDITION_SUFFIX: ${{ matrix.edition == 'taa' && '-taa' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Restore node_modules cache
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: .build/node_modules_cache
          key: node_modules-windows-arm64-${{ hashFiles('package-lock.json') }}

      - name: Extract node_modules cache
        if: steps.cache-node-modules.outputs.cache-hit == 'true'
        shell: bash
        run: tar -xzf .build/node_modules_cache/cache.tgz

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -e
          for i in {1..3}; do
            npm ci && break
            if [ $i -eq 3 ]; then echo "npm ci failed" >&2; exit 1; fi
            echo "Retry $i..."
          done
        env:
          npm_config_arch: arm64
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create node_modules cache
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -e
          mkdir -p .build
          node build/azure-pipelines/common/listNodeModules.ts .build/node_modules_list.txt
          mkdir -p .build/node_modules_cache
          tar -czf .build/node_modules_cache/cache.tgz --files-from .build/node_modules_list.txt

      - name: Select coding-agent edition
        shell: bash
        run: node scripts/select-nexgile-edition.mjs ${{ matrix.edition }}

      - name: Download built-in extensions
        shell: bash
        run: node build/lib/builtInExtensions.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Add Windows SDK (signtool) to PATH
        shell: pwsh
        run: |
          $sdk = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue | Sort-Object FullName | Select-Object -Last 1
          if ($sdk) {
            $dir = Split-Path $sdk.FullName
            "$dir" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
            Write-Host "Added signtool to PATH: $dir"
          } else {
            Write-Warning "signtool.exe not found under Windows Kits 10 bin"
          }

      - name: Build client (minified)
        shell: bash
        run: npm run gulp vscode-win32-arm64-min
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package .zip
        shell: bash
        run: |
          set -e
          cd ../VSCode-win32-arm64
          7z a "$GITHUB_WORKSPACE/.build/NexgileCode-win32-arm64$EDITION_SUFFIX.zip" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexgileCode-win32-arm64${{ env.EDITION_SUFFIX }}
          path: .build/NexgileCode-win32-arm64${{ env.EDITION_SUFFIX }}.zip
          retention-days: 30

      - name: Build setup installer
        shell: bash
        run: npm run gulp vscode-win32-arm64-user-setup
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: NexgileCodeSetup-win32-arm64${{ env.EDITION_SUFFIX }}
          path: .build/win32-arm64/user-setup/*.exe
          retention-days: 30
